<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="color-scheme" content="dark">
<title>Ôn tập</title>
<style>
:root{--bg:#000;--bgr:0,0,0;--s1:rgba(5,5,5,.55);--card:rgba(12,12,14,.62);--card2:rgba(28,28,32,.7);--pop:#111;--bd:rgba(255,255,255,.09);--bd2:rgba(255,255,255,.2);--tx:#f2f2f3;--tx2:#d6d6db;--mut:#8b8b94;--ac:#8ab4ff;--ac2:#a78bfa;--ac3:#4ade80;--acd:rgba(138,180,255,.14);--onac:#000;--ok:#4ade80;--okb:rgba(6,33,15,.85);--no:#ff6b6b;--nob:rgba(38,12,12,.85);--g1:rgba(138,180,255,.30);--g2:rgba(167,139,250,.22);--g3:rgba(74,222,128,.12);--r:16px}
/* Theme 1: Rừng xuân (Aquadulce · Aroma Green · Winter Mist · Tarragon · Antique Moss · Chalet Green) */
html[data-theme=green]{--bg:#07120b;--bgr:7,18,11;--s1:rgba(9,22,14,.55);--card:rgba(14,32,21,.6);--card2:rgba(30,58,38,.6);--pop:#10261a;--bd:rgba(205,232,212,.14);--bd2:rgba(205,232,212,.3);--tx:#eef7ef;--tx2:#cfe3d3;--mut:#8fb09a;--ac:#bad17a;--ac2:#97c49e;--ac3:#cde8d4;--acd:rgba(186,209,122,.14);--g1:rgba(128,163,47,.34);--g2:rgba(108,155,118,.30);--g3:rgba(205,232,212,.12)}
/* Theme 2: Đêm xanh (Icy Blue · Cornflower · Persian · Dusk · Deep Navy) */
html[data-theme=blue]{--bg:#070e2e;--bgr:7,14,46;--s1:rgba(9,21,64,.55);--card:rgba(14,26,80,.55);--card2:rgba(40,60,150,.4);--pop:#0e1a52;--bd:rgba(171,210,250,.15);--bd2:rgba(171,210,250,.32);--tx:#eaf2ff;--tx2:#c6d6f5;--mut:#8ea3d6;--ac:#abd2fa;--ac2:#7692ff;--ac3:#cfe4ff;--acd:rgba(171,210,250,.14);--g1:rgba(27,44,193,.55);--g2:rgba(118,146,255,.32);--g3:rgba(61,81,140,.5)}
/* nền ánh sáng chuyển động chậm */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg)}
.bg i{position:absolute;width:80vmax;height:80vmax;border-radius:50%;will-change:transform}
.bg i:nth-child(1){left:-25vmax;top:-30vmax;background:radial-gradient(closest-side,var(--g1),transparent);animation:d1 26s ease-in-out infinite alternate}
.bg i:nth-child(2){right:-30vmax;top:25%;background:radial-gradient(closest-side,var(--g2),transparent);animation:d2 34s ease-in-out infinite alternate}
.bg i:nth-child(3){left:5%;bottom:-40vmax;background:radial-gradient(closest-side,var(--g3),transparent);animation:d3 42s ease-in-out infinite alternate}
.bg::after{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 38%,var(--g2) 50%,transparent 62%);opacity:.55;transform:translateX(-30%);animation:sweep 18s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate3d(22vmax,16vmax,0) scale(1.15)}}
@keyframes d2{to{transform:translate3d(-24vmax,-14vmax,0) scale(.9)}}
@keyframes d3{to{transform:translate3d(18vmax,-20vmax,0) scale(1.2)}}
@keyframes sweep{to{transform:translateX(30%)}}
.card,.tile,.kpi,.stat,.sum,.icon-btn,.tchip{-webkit-backdrop-filter:blur(14px) saturate(1.15);backdrop-filter:blur(14px) saturate(1.15)}
/* menu ☰ */
.top+.hero{padding-top:6px}
.dwrap{position:fixed;inset:0;z-index:9}
.dscrim{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .2s ease}
.drawer{position:absolute;left:0;top:0;bottom:0;width:min(320px,86vw);background:var(--pop);border-right:1px solid var(--bd);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto;animation:slidein .25s ease backwards}
@keyframes slidein{from{transform:translateX(-100%)}}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.drawer .sec{margin-top:18px}
.trow{display:flex;align-items:center;gap:12px;width:100%;padding:12px;min-height:52px;margin-bottom:8px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card2)}
.trow i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.trow .ck{margin-left:auto;opacity:0}
.trow.on{border-color:var(--ac);background:var(--acd);color:var(--ac);font-weight:600}.trow.on .ck{opacity:1}
/* (cũ) */
.themes{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:16px}
.tchip{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 7px;min-height:38px;border-radius:99px;border:1.5px solid var(--bd);background:var(--card);font-size:13px}
.tchip i{width:22px;height:22px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.tchip.on{border-color:var(--ac);background:var(--acd);color:var(--ac);font-weight:600}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:left;transition:transform .12s ease,background .2s ease,border-color .2s ease,opacity .2s ease}
button:active:not(:disabled){transform:scale(.97)}
h1{font-size:24px;line-height:1.25;margin:0 0 6px}h2{margin:0 0 6px;font-size:19px}
p{margin:0}.mut{color:var(--mut);font-size:14px}
.screen.enter{animation:in .26s ease backwards}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.stagger>*{animation:in .32s ease backwards;animation-delay:calc(var(--i,0)*45ms)}
/* home */
.hero{text-align:center;padding:28px 0 22px}.hero .logo{font-size:44px}.hero h1{letter-spacing:.14em;font-size:22px;margin-top:8px}
.grid{display:grid;gap:12px}@media(min-width:560px){.grid.two{grid-template-columns:1fr 1fr}}
.tile{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;min-height:76px}
.tile .ico{flex:none;width:48px;height:48px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:26px}
.tile .tt{flex:1;min-width:0}.tile b{display:block;font-size:17px;overflow-wrap:anywhere}
.tile .go{color:var(--mut);font-size:20px}
.tile.off{opacity:.45;cursor:default}.tile.off:active{transform:none}
@media(hover:hover){.tile:not(.off):hover{border-color:var(--bd2);background:var(--card2)}}
.tile.chap{align-items:flex-start;flex-direction:column;gap:4px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;color:var(--mut);border:1px solid var(--bd);border-radius:99px;padding:2px 10px}
/* top bars */
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
/* ẩn nút menu ☰ (code menu/giao diện vẫn còn, muốn hiện lại chỉ cần xóa 2 dòng này) */
.top:has(>[data-act=menu]:only-child){display:none}
.top:has(>[data-act=menu]:only-child)+.hero{padding-top:28px}
.icon-btn{flex:none;width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--bd);display:grid;place-items:center;font-size:20px;text-align:center}
.top .ttl{font-weight:700;font-size:18px;overflow-wrap:anywhere}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px;margin-bottom:12px}
/* intro */
.big{font-size:22px;font-weight:700;line-height:1.3;margin:4px 0 8px;overflow-wrap:anywhere}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
.pick button{border:1.5px solid var(--bd);border-radius:12px;padding:10px 14px;min-height:44px;background:var(--s1)}
.pick button.on{border-color:var(--ac);background:var(--acd);color:var(--ac);font-weight:600}
.rules{margin-top:14px;display:grid;gap:4px}
/* summary */
.sum{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.sum summary{list-style:none;cursor:pointer;padding:15px 18px;min-height:52px;display:flex;align-items:center;justify-content:space-between;font-weight:700;-webkit-user-select:none;user-select:none}
.sum summary::-webkit-details-marker{display:none}
.sum .chev{color:var(--mut);font-size:22px;transition:transform .25s ease}.sum[open] .chev{transform:rotate(90deg)}
.sumbody{padding:0 18px 16px;animation:in .25s ease backwards}
.sh{display:flex;gap:10px;align-items:center;font-weight:700;color:var(--ac);margin-top:16px}
.sn{flex:none;width:24px;height:24px;border-radius:8px;background:var(--acd);display:grid;place-items:center;font-size:13px}
.sumbody ul{margin:6px 0 0;padding-left:20px}.sumbody li{margin:5px 0;color:var(--tx2);overflow-wrap:anywhere;font-size:15px}.sumbody li b{color:var(--tx)}
/* buttons */
.btn{display:block;width:100%;background:var(--ac);color:var(--onac);font-weight:700;text-align:center;border-radius:14px;padding:15px 18px;min-height:52px;margin-top:10px}
.btn:disabled{opacity:.35}.btn.alt{background:var(--card);color:var(--tx);border:1.5px solid var(--bd);font-weight:600}
.dock{position:sticky;bottom:0;margin:0 -16px;padding:18px 16px calc(6px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(var(--bgr),0),rgba(var(--bgr),.9) 45%)}
.dock .btn{margin-top:0}
/* quiz */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar{flex:1;height:6px;background:var(--card2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ac);border-radius:4px;transform-origin:left;transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.count{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.tag{font-size:12px;font-weight:700;color:var(--ac);margin-bottom:6px}
.q{font-weight:700;font-size:17px;white-space:pre-line;overflow-wrap:anywhere;margin-bottom:6px}
.opt{display:flex;gap:10px;width:100%;background:var(--s1);border:1.5px solid var(--bd);border-radius:12px;padding:13px 14px;margin:8px 0;min-height:50px;overflow-wrap:anywhere}
.opt b{flex:none}.opt span{min-width:0}
.opt.sel{border-color:var(--ac);background:var(--acd)}
.opt.ok{border-color:var(--ok);background:var(--okb);animation:pop .3s ease}
.opt.bad{border-color:var(--no);background:var(--nob)}
.locked .opt.bad{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
.snd{width:40px;height:40px;font-size:18px;border-radius:12px}
@keyframes pop{50%{transform:scale(1.015)}}
.locked .opt{pointer-events:none}
.row{border-top:1px solid var(--bd);padding:10px 0}.row:first-child{border:0}
.row .st{overflow-wrap:anywhere}.row .st b{color:var(--mut)}
.tf{display:flex;gap:8px;margin-top:6px}.tf .opt{margin:0;justify-content:center;text-align:center}
.msg{font-weight:700;margin-top:12px;animation:in .25s ease backwards}.msg.ok{color:var(--ok)}.msg.bad{color:var(--no)}
/* result */
.result{text-align:center;padding-top:14px}
.result .emoji{font-size:52px;display:inline-block;animation:bounce .7s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes bounce{from{transform:scale(.2);opacity:0}}
.ring{position:relative;width:170px;height:170px;margin:14px auto}
.ring svg{width:100%;height:100%}.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .rt{stroke:var(--card2)}.ring .rf{stroke:var(--ac);transition:stroke-dashoffset 1s cubic-bezier(.3,.7,.2,1)}
.ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rc b{font-size:30px;line-height:1.1}.ring .rc span{color:var(--mut);font-size:15px;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:10px;margin:6px 0 14px}.stat{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;color:var(--mut);font-size:14px}
.stat b{display:block;font-size:24px}.stat.ok b{color:var(--ok)}.stat.no b{color:var(--no)}
/* review + modal */
.opt.static{pointer-events:none}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:1px 9px;margin-left:6px}.pill.ok{background:var(--okb);color:var(--ok)}.pill.no{background:var(--nob);color:var(--no)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:20px;z-index:9;animation:fade .2s ease}
.dialog{width:100%;max-width:360px;background:var(--pop);border:1px solid var(--bd);border-radius:20px;padding:20px;animation:in .25s ease backwards}
@keyframes fade{from{opacity:0}}
@media(prefers-reduced-motion:reduce){.bg i,.bg::after{animation:none!important}*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

.sec{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:26px 2px 10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px}.kpi b{display:block;font-size:26px;line-height:1.15}.kpi span{color:var(--mut);font-size:13px}.kpi.a b{color:var(--ac)}
.chart{display:flex;align-items:flex-end;gap:8px;height:104px;margin-top:10px}.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}.chart i{display:block;width:100%;max-width:30px;border-radius:6px 6px 3px 3px;background:var(--ac)}.chart .z i{background:var(--bd)}.chart em{font-style:normal;font-size:11px;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--bd);font-size:14px}.row:first-child{border-top:0;padding-top:0}.row:last-child{padding-bottom:0}.row b{font-size:16px}
.lnk{display:block;margin:18px auto 0;color:var(--mut);font-size:13px;text-align:center;padding:8px}
</style>

          { text: "Xu thế toàn cầu hoá khiến cho tình trạng chạy đua vũ trang của Mỹ và Liên Xô không còn phù hợp.", answer: true },
          { text: "Trật tự thế giới hai cực I-an-ta sụp đổ gắn liền với sự khủng hoảng và suy yếu của Liên Xô.", answer: true },
          { text: "Sự vươn lên của các nước đang phát triển khiến cho Mỹ suy yếu, không còn đủ sức chạy đua kinh tế.", answer: false }
        ] },
      { id: "history-2-T-02", type: "true_false", tag: "Đúng/Sai",
        question: "Cho đoạn tư liệu sau đây: “Trước kia, chế độ quân chủ tại Hy Lạp đã nhờ vào sự giúp đỡ của Anh, nhưng sau Chiến tranh thế giới thứ hai, kinh tế của nước Anh hoàn toàn suy kiệt, lo cho mình còn không xong, nên không thể giúp đỡ gì cho chế độ quân chủ ở Hy Lạp nữa. Vào ngày 12-3-1947, Tổng thống Tơ-ru-man đã đọc một bài diễn văn tại lưỡng viện Quốc hội Mỹ, cho rằng Hy Lạp và Thổ Nhĩ Kỳ nếu bị rơi vào khối xã hội chủ nghĩa, thì cả Trung Đông cũng sẽ rơi theo... sẽ làm cho cả Tây Âu bị ảnh hưởng. Do vậy, ông thuyết phục Quốc hội Mỹ chi viện kinh tế và quân sự cho Hy Lạp và Thổ Nhĩ Kỳ với số tiền 400 triệu đô la. Li luận này về sau được gọi là “Học thuyết Tơ-ru-man”“. (Vương Kính Chi, Lược sử nước Mỹ (Phong Đảo dịch), NXB Thành phố Hồ Chí Minh, Thành phố Hồ Chí Minh, 2000, tr.145)",
        statements: [
          { text: "Chiến tranh lạnh là cuộc đối đầu gay gắt giữa Mỹ và Liên Xô, chỉ diễn ra ở châu Âu.", answer: false },
          { text: "Thông điệp của Tổng thống Mỹ Tơ-ru-man đọc trước Quốc hội Mỹ ngày 12-3-1947 Tin đã khởi đầu cuộc Chiến tranh lạnh chống lại Liên Xô và các nước Đông Âu.", answer: true },
          { text: "Nguồn gốc của sự đối đầu căng thẳng giữa Mỹ và Liên Xô xuất phát từ “vấn đề Hy Lạp và Thổ Nhĩ Kỳ” sau Chiến tranh thế giới thứ hai.", answer: false },
          { text: "Học thuyết Tơ-ru-man phản ánh chính sách đối ngoại của Mỹ sau Chiến tranh thế giới thứ hai, muốn đưa nước Mỹ trở thành bá chủ thế giới.", answer: true }
        ] },
      { id: "history-2-T-03", type: "true_false", tag: "Đúng/Sai",
        question: "Cho bảng dữ kiện sau đây: Từ đầu những năm 70 của thế kỉ XX, trên thế giới diễn ra nhiều cuộc gặp gỡ thương lượng của nguyên thủ quốc gia các nước và khu vực: Mỹ và Liên Xô, Mỹ với Trung Quốc, hai miền nước Đức, Đông Âu và Tây Âu,...; Tháng 12-1989, trong một cuộc họp không chính thức tại đảo Man-ta (Địa Trung Hải), đại diện hai nhà lãnh đạo cấp cao của Liên Xô (Goóc-ba-chốp) và Mỹ (Bu-sơ) đã chính thức cùng tuyên bố chấm dứt Chiến tranh lạnh.; Sau Chiến tranh lạnh, Liên Xô, Mỹ và các nước đã thỏa thuận giải quyết cuộc xung đột ở nhiều nơi trên thế giới bằng giải pháp hoà bình: ở Áp-ga-ni-xtan, Cam-pu-chia, Tây Nam Phi,...; Nhiều tổ chức liên minh khu vực và châu lục được mở rộng, hoặc thay đổi tên gọi mới, kết nạp thêm thành viên và kết nối liên lục địa (ASEAN, EU, ASEM, APEC,...).;",
        statements: [
          { text: "Mặc dù Chiến tranh lạnh vẫn tiếp diễn, nhưng từ đầu những năm 70 của thế kỉ XX, xu thế hoà hoãn Đông – Tây đã diễn ra.", answer: true },
          { text: "Xu thế hoà hoãn Đông – Tây chỉ được diễn ra, bàn luận và quyết định bởi các cuộc gặp gỡ thương lượng giữa nguyên thủ quốc gia của hai nước Liên Xô và Mỹ.", answer: false },
          { text: "Trong xu thế hoà hoãn Đông – Tây, Việt Nam luôn ủng hộ và đã thành công trong việc kí Hiệp định Pa-ri (1973) và giải quyết “vấn đề Cam-pu-chia” (1991).", answer: true },
          { text: "Chiến tranh lạnh chấm dứt, sau đó là Trật tự thế giới hai cực I-an-ta sụp đổ đã tạo ra những ưu thế cho Mĩ trong việc chi phối nhiều vấn đề quốc tế.", answer: true }
        ] },
      { id: "history-2-T-04", type: "true_false", tag: "Đúng/Sai",
        question: "Cho đoạn tư liệu sau đây: “Vào thập niên 1980, mối quan hệ nồng ấm giữa Tổng thống Mỹ Ri-gân và nhà lãnh đạo Liên Xô Goóc-ba chớp đã giúp giảm dần tình trạng căng thẳng của CTL. Năm 1987, hai nhà lãnh đạo đã đồng ý huỷ bỏ tên lửa hạt nhân tầm trung. Năm 1989. Goóc-ba chấp cho phép các quốc gia XHCN ở Đông Âu bầu ra chính phủ dân chủ, và đến năm 1991, Liên Xô tan rã thành 15 nước cộng hoà độc lập. Ngày 12-3-1999 Hung-ga-ri, Ba Lan và Cộng hoà Séc gia nhập khối NATO”. (King Fisher, Bách khoa thư lịch sử (Nguyễn Đức Tĩnh và Ngô Minh Châu dịch), NXB Thế giới, Hà Nội, 2016, tr.437)",
        statements: [
          { text: "Trật tự thế giới hai cực I-an-ta bắt đầu bị xói mòn và sụp đổ trong thập niên 1980.", answer: false },
          { text: "Chiến tranh lạnh kết thúc bắt nguồn từ những nguyên nhân khác nhau, nhưng sự suy giảm thế mạnh của Mỹ và Liên Xô là nguyên nhân quyết định.", answer: true },
          { text: "Cuộc Chiến tranh lạnh đã kết thúc và Trật tự thế giới hai cực I-an-ta đã sụp đổ, nhưng nhiều di chứng của nó vẫn còn và vẫn đang tiếp diễn ở nhiều nơi trên thế giới.", answer: true },
          { text: "Việc Liên Xô tan rã (1991) đã chính thức chấm dứt cục diện hai cực, hai phe.", answer: true }
        ] },
      { id: "history-2-T-05", type: "true_false", tag: "Đúng/Sai",
        question: "Cho đoạn tư liệu sau đây: “Liên Xô và Mỹ, một là nhà nước xã hội chủ nghĩa lớn nhất, một là nước tư bản chủ nghĩa lớn nhất. Chịu sự chi phối của tín ngưỡng ý thức hệ, hai nước dựa vào tiến triển của Chiến tranh thế giới thứ hai và cục diện sau chiến tranh để ra sức mở rộng phạm vi ảnh hưởng tín ngưỡng ý thức hệ của bản thân, ở những khu vực mà khả năng cho phép đều xảy dựng và duy trì chế độ giống như của mình”. (Trương Tiểu Minh, Chiến tranh lạnh và di sản của nó, NXB Chính trị Quốc gia, 2002, tr.36)",
        statements: [
          { text: "Liên Xô và Mỹ là hai cường quốc đứng đầu hai hệ thống xã hội đối lập trên thế giới.", answer: true },
          { text: "Sau chiến tranh thế giới thứ hai, Liên Xô và Mỹ đều mở rộng phạm vi ảnh hưởng của mình trên thế giới.", answer: true },
          { text: "Sau chiến tranh thế thế giới thứ hai, mâu thuẫn giữa hai nước thực chất là mâu thuẫn về ý thức hệ.", answer: true },
          { text: "Cuộc tranh giành thuộc địa của Mỹ và Liên Xô sau chiến tranh không có hồi kết.", answer: false }
        ] },
      { id: "history-2-T-06", type: "true_false", tag: "Đúng/Sai",
        question: "Cho bảng dữ kiện sau đây: Thời gian – Nội dung; 1950-1953 – Chiến tranh Triều Tiên.; 1945-1954 – Chiến tranh Đông Dương.; 1954-1975 – Chiến tranh Việt Nam.; Từ năm 1948 đến nay – Xung đột Trung Đông giữa Israel và các nước Ả rập.;",
        statements: [
          { text: "Trong thời kỳ Chiến tranh lạnh, không xảy ra cuộc chiến tranh giữa các nước nhưng thế giới luôn ở trong tình trạng căng thẳng.", answer: false },
          { text: "Chiến tranh Triều Tiên là sản phẩm của Chiến tranh lạnh, là cuộc đụng độ đầu tiên trực tiếp giữa hai phe.", answer: true },
          { text: "Chiến tranh xâm lược Việt Nam của đế quốc Mỹ là cuộc chiến tranh cục bộ lớn nhất phản ánh mâu thuẫn giữa hai phe.", answer: true },
          { text: "Xung đột Trung Đông giữa Israel và các nước Ả rập là biểu hiện của Chiến tranh lạnh kiểu mới.", answer: false }
        ] },
      { id: "history-2-T-07", type: "true_false", tag: "Đúng/Sai",
        question: "Cho đoạn tư liệu sau đây: “Trong Trật tự thế giới hai cực Ianta, Liên Xô đã đạt được 3 mục tiêu: bảo vệ vững chắc sự tồn tại và phát triển của đất nước Xô viết; thu hồi lại những đất đai của đế quốc Nga trước đây (kể - từ chiến tranh Nga - Nhật 1904 - 1905 đến chiến tranh chống ngoại xâm và nội phản 1918-1920); mở rộng phạm vi ảnh hưởng ở châu Âu và châu Á, qua đó thiết lập một vành đai an toàn bao quanh phía tây, đồng và nam Liên Xô. Còn Mỹ, đã khống chế được Tây Âu, , Nhật Bản, chỉ phối cục diện thế giới. Mặt khác, sự thoả thuận giữa ba cường quốc ở Hội nghị lanta đã xâm phạm đến chủ quyền, lãnh thổ và lợi ích của nhân dân nhiều nước”. (Nguyễn Anh Thái (Chủ biên), Lịch sử thế giới hiện đại, NXB Giáo dục, 2006 tr.234)",
        statements: [
          { text: "Trong trật tự thế giới hai cực Ianta, Mỹ và Liên Xô đều đạt được những mục tiêu cơ bản của mình.", answer: true },
          { text: "Những quyết định của hội nghị lanta không tác động đến phong trào giải phóng dân tộc trên thế giới.", answer: false },
          { text: "Mỹ đã phần nào khống chế và chi phối các nước đồng minh, đứng đầu các nước tư bản chủ nghĩa.", answer: true },
          { text: "Liên Xô đã thiết lập được hệ thống các nước xã hội chủ nghĩa để bảo vệ an toàn xung quanh toàn bộ lãnh thổ đất nước.", answer: true }
        ] },
      { id: "history-2-T-08", type: "true_false", tag: "Đúng/Sai",
        question: "Cho đoạn tư liệu sau đây: “Việc nhà lãnh đạo kỳ cựu Honecker ra đi, thúc đẩy nhanh tiến trình tan rã của bộ máy Đảng và Nhà nước CHDC đức. Liên tiếp trong các trưởng và Bộ Chính trị Đảng Xã các ngày 7 và 8/11/1989, toàn t thể Hội đồng Bộ à hội chủ à nghĩa Thống nhất Đức từ chức tập thể. Cuộc “cách mạng êm dịu” và không dùng vũ lực đã làm tê liệt các cơ quan nhà nước. Uỷ viên Bộ Chính trị, Bí thư Thành uỷ Berlin Schabowski tuyên bố mở tất cả cửa khẩu ở Berlin vào tối ngày 9/11/1989. Bức tường Berlin được mở toang. Biến cố này gây chấn động không chỉ ở châu Âu mà cả toàn thế giới: bức tường Berlin, biểu tượng cho sự chia cắt châu Âu, cho Chiến tranh lạnh và trật tự thế giới ra đời sau Chiến tranh thế giới thứ hai nay không còn nữa”. (Trần Nam Tiến (Chủ biên), Lịch sử quan hệ quốc tế hiện đại (1945-2000), NXB Giáo dục, 2010, tr.262).",
        statements: [
          { text: "Bức tường Berlin là biểu tượng cho sự chia cắt nước Đức và châu Âu.", answer: true },
          { text: "Nước Đức bị chia cắt theo quy định của các cường quốc tại Hội nghị Ianta.", answer: true },
          { text: "Quá trình thống nhất đất nước Đức được tiến hành bằng con đường vũ lực.", answer: false },
          { text: "Bức tường Berlin bị phá bỏ đã chấm dựt tình trạng đối đầu giữa Mỹ và Liên Xô.", answer: false }
        ] },
      { id: "history-2-T-09", type: "true_false", tag: "Đúng/Sai",
        question: "Cho đoạn tư liệu sau đây: “Tuy đối đầu quyết liệt như vậy, nhưng do nhiều nguyên nhân, nhất là liên quan tới nguy cơ thảm hoạ của một cuộc chiến tranh hạt nhân và sau này là cuộc chạy đua kinh tế, dưới tác động của cách mạng khoa học - kỹ thuật, có thể nói cả hai siêu cường Mỹ - Xô đều thực hiện chiến lược phòng ngự và các nước lớn như Mỹ, Anh, Pháp cũng như Liên Xô, Trung Quốc đều ra sức tránh nguy cơ gây ra đụng đầu trực tiếp giữa các nước lớn. Do đó, thế giới trong Trật tự thế giới hai cực lanta là vừa trong tình trạng đối đầu lại vừa hoà hoãn chung sống hoà bình, vừa đấu tranh, vừa hợp tác”. (Nguyễn Cơ Thạch, Thế giới 50 năm qua (1945 - 1995) và thế giới trong 25 năm tới (1996-2020), Nxb Chính trị Quốc gia, 1998, tr.41)",
        statements: [
          { text: "Mỹ và Liên Xô đều chạy đua vũ trang, ráo riết chuẩn bị cho chiến tranh hạt nhân.", answer: false },

          { text: "Năm 1991, trật tự I-an-ta sụp đổ với sự tan rã của hai phe tư bản chủ nghĩa và xã hội chủ nghĩa.", answer: false },
          { text: "Trật tự hai cực Ianta ảnh hưởng đến các mối quan hệ quốc tế trong giai đoạn 1945 – 1991.", answer: true }
        ] },
      { id: "history-2-T-10", type: "true_false", tag: "Đúng/Sai",
        question: "Cho đoạn tư liệu sau đây: “Bài học của thời kỳ Chiến tranh lạnh đã chứng tỏ phương thức quan hệ quốc tế lấy đối đầu chính trị - quân sự là chủ yếu không còn phù hợp, phải chịu nhiều tổn thất hoặc thất bại như hai nước Mỹ-Xô và “một bị thương, một bị mất”. Trong khi đó, phương thức lấy hợp tác và cạnh tranh về kinh tế - chính trị là chính lại thu được nhiều tiến bộ, kết quả như các nước Đức, Nhật và NIC. Sự hưng thịnh hay suy vong của một quốc gia quyết định bởi sức mạnh tổng hợp của quốc gia đó, mà chủ yếu là thực lực kinh tế và khoa học - kỹ thuật”. (Lý Thực Cốc (1996), Mỹ thay đổi chiến lược toàn cầu, NXB Chính trị Quốc gia, tr.30)",
        statements: [
          { text: "Trong kỳ Chiến tranh lạnh, phương thức quan hệ quốc tế lấy đổi đầu chính trị - quân sự là chủ yếu.", answer: true },
          { text: "Liên Xô và Mỹ đều sụp đổ sau thời kỳ dài đối đầu căng thẳng, chạy đua vũ trang.", answer: false },
          { text: "Yếu tố kinh tế và khoa học kĩ thuật là một trong những nhân tố quan trọng dẫn đến sự kết thúc của chiến tranh lạnh.", answer: true },
          { text: "Bài học rút ra từ chiến tranh lạnh là các quốc gia cần có đường lối đối ngoại độc lập, tự chủ.", answer: false }
        ] }

    select: (r, d, root) => { const k = +d.k, v = d.v === "1"; r.statements[k].picked = v; root.querySelectorAll(`[data-act=ans][data-k="${k}"]`).forEach(el => el.classList.toggle("sel", (el.dataset.v === "1") === v)); },
    ready: r => r.statements.every(s => s.picked !== null),

/* ---------- Hiệu ứng: âm thanh (Web Audio, không cần file) + pháo giấy ---------- */
const sfx = { on: true, ctx: null };
try { sfx.on = localStorage.getItem("quiz.sound") !== "0"; } catch (e) {}
function tone(f, t, dur, type, vol, f2) {
  const c = sfx.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
}
function playSound(kind) {
  if (!sfx.on) return;
  try {
    sfx.ctx = sfx.ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (sfx.ctx.state === "suspended") sfx.ctx.resume();
    const t = sfx.ctx.currentTime;
    if (kind === "ok") { tone(659.25, t, .16, "sine", .2); tone(880, t + .11, .18, "sine", .2); tone(1318.5, t + .22, .32, "sine", .16); }
    else if (kind === "wrong") { tone(220, t, .35, "triangle", .25, 90); tone(165, t + .12, .35, "triangle", .2, 70); }
    else tone(880, t, .12, "sine", .15);
  } catch (e) {}
}
let confettiCanvas = null;
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if (confettiCanvas) confettiCanvas.remove();
  const cv = confettiCanvas = document.createElement("canvas"), dpr = Math.min(window.devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
  const g = cv.getContext && cv.getContext("2d"); if (!g) return;
  cv.className = "confetti"; cv.width = W * dpr; cv.height = H * dpr; document.body.appendChild(cv); g.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement), cols = ["--ac", "--ac2", "--ac3", "--ok", "--tx"].map(v => cs.getPropertyValue(v).trim()), vmax = Math.sqrt(2 * .32 * H * .8), P = [];
  for (let i = 0; i < 80; i++) {
    const left = i % 2 === 0, a = (Math.random() * 30 + 8) * Math.PI / 180, v = vmax * (.55 + Math.random() * .5);
    P.push({ x: left ? W * .05 : W * .95, y: H + 10, vx: (left ? 1 : -1) * Math.sin(a) * v, vy: -Math.cos(a) * v, r: Math.random() * 6, vr: Math.random() * .3 - .15, f: Math.random() * 6, vf: .1 + Math.random() * .2, w: 6 + Math.random() * 6, h: 4 + Math.random() * 5, c: cols[i % cols.length] });
  }
  const T = 2600; let last = performance.now(); const t0 = last;
  (function step(now) {
    const k = Math.min(2, (now - last) / 16.7); last = now;
    g.clearRect(0, 0, W, H);
    g.globalAlpha = Math.max(0, Math.min(1, (T - (now - t0)) / 700));
    for (const p of P) {
      p.vy += .32 * k; p.vx *= Math.pow(.99, k); p.vy *= Math.pow(.99, k);
      p.x += p.vx * k; p.y += p.vy * k; p.r += p.vr * k; p.f += p.vf * k;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.scale(1, Math.cos(p.f)); g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore();
    }
    if (now - t0 < T) requestAnimationFrame(step); else { cv.remove(); if (confettiCanvas === cv) confettiCanvas = null; }
  })(last);
}

/* startQuiz("history", "history-1") — engine chung cho mọi môn.
   tag: lọc theo nhóm ("all" = tất cả) · retryList: danh sách câu gốc để làm lại câu sai */
function startQuiz(subjectId, chapterId, tag = "all", retryList = null) {
  const ch = getChapter(subjectId, chapterId); if (!ch) return;
  const src = retryList || ch.questions.filter(q => tag === "all" || q.tag === tag);
  if (!src.length) return;
  Object.assign(S, { subjectId, chapterId, tag, retry: !!retryList, list: shuffle(src).map(prepare), idx: 0, correct: 0, wrong: [], locked: false });
  go("quiz");
}

    return topbar(esc(s.name)) + `<div class="card"><div class="eyebrow">${esc(c.title)}</div><div class="big">${esc(c.subtitle)}</div>${c.description ? `<p class="mut">${esc(c.description)}</p>` : ""}<p class="mut">${c.questions.length} câu hỏi</p>` +
    (tags.length > 1 ? `<div class="pick" id="pick">${[["all", "Tất cả", c.questions.length], ...tags.map(([t, n]) => [t, t, n])].map(([t, l, n]) => `<button class="${S.tag === t ? "on" : ""}" data-act="tag" data-tag="${esc(t)}">${esc(l)} · ${n}</button>`).join("")}</div>` : "") +
    `<div class="pick"><button id="ordbtn" class="${keepOrder ? "on" : ""}" data-act="order">🔒 Không xáo trộn</button><button data-act="answers">👁 Xem đáp án</button></div>` +
    `<div class="rules mut"><span id="shuf">${keepOrder ? "Câu hỏi và đáp án giữ nguyên thứ tự như đề." : "Câu hỏi và đáp án được xáo trộn ngẫu nhiên."}</span>${rules.map(r => `<span>${esc(r)}</span>`).join("")}</div></div>` + sum +
    `<div class="dock"><button class="btn" id="start" data-act="start">Bắt đầu kiểm tra (${countFor(c, S.tag)} câu)</button></div>`; },

  quiz: () => { const r = cur(), n = S.list.length;
    return `<div class="qhead"><button class="icon-btn" data-act="back" aria-label="Thoát">←</button><div class="bar"><i id="bar" style="transform:scaleX(${S.idx / n})"></i></div><span class="count">${S.idx + 1}/${n}</span><button class="icon-btn snd" data-act="sound" aria-label="Bật/tắt âm thanh">${sfx.on ? "🔊" : "🔇"}</button></div>` +
    `<div class="card"><div class="tag">${S.retry ? "LÀM LẠI · " : ""}${esc(chap().title)} · ${esc(r.src.tag)}</div><p class="q">${esc(r.src.question)}</p><div id="opts">${TYPES[r.type].render(r)}</div><div id="res"></div></div>` +
    `<div class="dock"><button class="btn" id="go" data-act="next" disabled>Xác nhận</button></div>`; },

  result: () => { const n = S.list.length, w = n - S.correct;
    return `<div class="result"><div class="emoji">🎉</div><h1>Hoàn thành!</h1><p class="mut">${w ? `Bạn sai ${w} câu.` : "Tuyệt vời, không sai câu nào!"}</p>` +
    `<div class="ring"><svg viewBox="0 0 120 120"><circle class="rt" cx="60" cy="60" r="52"/><circle class="rf" id="ringf" cx="60" cy="60" r="52" transform="rotate(-90 60 60)" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg><div class="rc"><b>${S.correct} / ${n}</b><span id="pct">0%</span></div></div>` +
    `<div class="stats"><div class="stat ok"><b>${S.correct}</b>Đúng</div><div class="stat no"><b>${w}</b>Sai</div></div>` +
    (w ? `<button class="btn" data-act="review">Xem lại câu sai</button><button class="btn alt" data-act="retry">Làm lại ${w} câu đã sai</button>` : "") +
    `<button class="btn alt" data-act="restart">Làm lại</button><button class="btn alt" data-act="chapters">Về danh sách bài</button></div>`; },

  answers: () => { const c = chap(), cnt = {};
    const rows = c.questions.map(q => { cnt[q.tag] = (cnt[q.tag] || 0) + 1; return { q, n: cnt[q.tag] }; }).filter(x => S.tag === "all" || x.q.tag === S.tag);
    const rv = q => q.type === "single" ? { options: q.options, answer: q.answer, picked: null } : { statements: q.statements.map(t => ({ text: t.text, answer: t.answer, picked: t.answer })) };
    return topbar(`${esc(c.title)} · Đáp án`, `${rows.length} câu · đúng thứ tự đề`) + rows.map(({ q, n }) => `<div class="card"><div class="tag">${esc(q.tag)} · Câu ${n}</div><p class="q">${esc(q.question)}</p>${TYPES[q.type].review(rv(q))}</div>`).join(""); },

  review: () => topbar("Xem lại", `${S.wrong.length} câu sai`) + S.wrong.map(r => `<div class="card"><div class="tag">${esc(r.src.tag)}</div><p class="q">${esc(r.src.question)}</p>${TYPES[r.type].review(r)}</div>`).join("")
};

/* hiệu ứng sau khi render */
const AFTER = {
  result() {
    const p = S.correct / S.list.length, f = document.getElementById("ringf"), t = document.getElementById("pct"), t0 = performance.now();
    requestAnimationFrame(() => f.style.strokeDashoffset = 326.7 * (1 - p));
    (function tick(now) { const k = Math.min(1, (now - t0) / 900); t.textContent = (p * 100 * k).toFixed(1) + "%"; if (k < 1) requestAnimationFrame(tick); })(t0);
  }
};

function render(anim = true) {
  $app.innerHTML = `<div class="screen${anim ? " enter" : ""}">${VIEWS[S.view]()}</div>`;
  window.scrollTo(0, 0);
  if (AFTER[S.view]) AFTER[S.view]();
}
function go(view) { S.view = view; render(); }

/* ============================================================
   5. EVENT HANDLERS — điều hướng + tương tác (event delegation)
   ============================================================ */
function back() {
  if ($modal.innerHTML) return closeModal();
  const to = { subject: "home", intro: "subject", result: "subject", review: "result", answers: "intro" }[S.view];
  if (S.view === "quiz") return S.idx === 0 && !S.locked ? go("intro") : openModal();
  if (to) go(to);
}
function openModal() { $modal.innerHTML = `<div class="scrim"><div class="dialog"><h2>Thoát bài kiểm tra?</h2><p class="mut">Tiến trình làm bài hiện tại sẽ bị mất.</p><button class="btn" data-act="stay">Tiếp tục làm bài</button><button class="btn alt" data-act="leave">Thoát</button></div></div>`; }
function closeModal() { $modal.innerHTML = ""; }

function finish() { saveResult(); go("result"); }
function next() {
  const r = cur(), T = TYPES[r.type], n = S.list.length, btn = document.getElementById("go");
  if (S.locked) { S.idx++; S.locked = false; return S.idx >= n ? finish() : render(); }
  if (!T.ready(r)) return;
  S.locked = true;
  const good = T.check(r);
  T.reveal(r, $app);
  document.getElementById("opts").classList.add("locked");
  if (good) { S.correct++; confetti(); playSound("ok"); } else { S.wrong.push(r); playSound("wrong"); }
  document.getElementById("res").innerHTML = good ? `<div class="msg ok">✓ Chính xác!</div>` : `<div class="msg bad">✗ Bạn đã sai. ${T.feedback(r)}</div>`;
  document.getElementById("bar").style.transform = `scaleX(${(S.idx + 1) / n})`;
  btn.textContent = S.idx === n - 1 ? "Xem kết quả" : "Câu tiếp theo";
}

const ACTIONS = {
  menu: openMenu,
  order: () => {
    keepOrder = !keepOrder;
    try { localStorage.setItem("quiz.order", keepOrder ? "1" : "0"); } catch (e) {}
    const b = document.getElementById("ordbtn"); if (b) b.classList.toggle("on", keepOrder);
    const t = document.getElementById("shuf"); if (t) t.textContent = keepOrder ? "Câu hỏi và đáp án giữ nguyên thứ tự như đề." : "Câu hỏi và đáp án được xáo trộn ngẫu nhiên.";
    playSound("tick");
  },
  answers: () => go("answers"),
  theme: d => { setTheme(d.t, true); document.querySelectorAll(".trow").forEach(b => b.classList.toggle("on", b.dataset.t === theme)); playSound("tick"); },
  resume: d => { S.subjectId = d.s; S.chapterId = d.c; S.tag = "all"; go("intro"); },
  resetstats: () => { if (confirm("Xóa toàn bộ thống kê học tập?")) { try { localStorage.removeItem(HK); } catch (e) {} render(false); } },
  subject: d => { S.subjectId = d.id; go("subject"); },
  chapter: d => { S.chapterId = d.id; S.tag = "all"; go("intro"); },
  tag: d => {
    S.tag = d.tag;
    document.querySelectorAll("#pick button").forEach(b => b.classList.toggle("on", b.dataset.tag === S.tag));
    document.getElementById("start").textContent = `Bắt đầu kiểm tra (${countFor(chap(), S.tag)} câu)`;
  },
  start: () => startQuiz(S.subjectId, S.chapterId, S.tag),
  ans: d => { if (S.locked) return; const r = cur(); TYPES[r.type].select(r, d, $app); document.getElementById("go").disabled = !TYPES[r.type].ready(r); },
  next,
  back,
  stay: closeModal,
  leave: () => { closeModal(); go("intro"); },
  review: () => go("review"),
  retry: () => startQuiz(S.subjectId, S.chapterId, S.tag, S.wrong.map(r => r.src)),
  restart: () => startQuiz(S.subjectId, S.chapterId, S.tag),
  sound: () => {
    sfx.on = !sfx.on;
    try { localStorage.setItem("quiz.sound", sfx.on ? "1" : "0"); } catch (e) {}
    const b = document.querySelector("[data-act=sound]"); if (b) b.textContent = sfx.on ? "🔊" : "🔇";
    playSound("tick");
  },
  chapters: () => go("subject")
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (el && ACTIONS[el.dataset.act]) ACTIONS[el.dataset.act](el.dataset);
});

/* nút Back của điện thoại: quay lại màn trước thay vì thoát trang */
const guard = () => { try { history.pushState({ q: 1 }, ""); } catch (e) {} };
window.addEventListener("popstate", () => { if (S.view !== "home" || $modal.innerHTML) { guard(); back(); } });
guard();
render();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script>
</body></html>
